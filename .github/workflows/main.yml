name: Obter dados estaticos

on:
  #push:
  workflow_dispatch:
  schedule:
    - cron:  '1 8,13,1 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:

    - name: Check out this repo
      uses: actions/checkout@v4

# 1. UNCOMPRESS THE FILES AT THE START
    - name: Uncompress data files
      run: |
        # Use -f (force) and -q (quiet). If files don't exist yet (first run), allow it to pass.
        gzip -dfq *.xml.gz || true
      shell: bash
      
    - name: setup python
      uses: actions/setup-python@v5
      with:
         python-version: 3.8 #install the python needed    
         cache: 'pip' # caching pip dependencies
    - run: pip install -r requirements.txt
     
    - name: Get the NAP static data
      run: |
        chmod +x ./get_static.sh
        ./get_static.sh
      shell: bash
    - name: Processa estaticos XML para JSON
      run: |
        python t2.py
        python clear_removed.py

    - name: Compara dados com os anteriores
      run: |
        python compare_static.py

    - name: Converte os adicionados em formato OSM
      run: |
        python convert4.py

    #- name: Obtem lista de postos sem actualização há mais de 30 dias
    #  run: |
    #    python disused.py

    #- name: Obtem lista de postos sem charging há mais de 30 dias
    #  run: |
    #    python find_old2.py

    #- name: Pontos sem actualização que não estejam no watchbusy
    #  run: |
    #    python find_new_disused.py

    #- name: Encontrar CCS sem uso
    #  run: |
    #    python find_new_disused3.py
    #    python find_new_disused4.py

    - name: Encontrar tomadas sem uso 2026
      run: |
        python disused_dyna1.py
        python disused_dyna2.py
        python dyna5.py

    - name: Conta postos por OPC
      run: |
        python count_opc.py
        python compare_GPS.py

    - name: Verifica potencias
      run: |
        python power.py

# 2. COMPRESS THE FILES BEFORE COMMITTING
    - name: Compress data files
      run: |
        # Compress the 4 specific XML files, replacing them with .xml.gz versions
        gzip -f LATEST_dynamic.xml LATEST_static.xml PREVIOUS_dynamic.xml PREVIOUS_static.xml || true
      shell: bash
    
    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
